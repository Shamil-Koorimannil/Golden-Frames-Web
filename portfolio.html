    <style>
        .page-header {
            background-color: var(--color-bg-alt);
            padding: calc(var(--spacing-xl) + 80px) 0 var(--spacing-lg);
            text-align: center;
        }
        .page-header h1 {
            color: var(--color-primary);
            margin-bottom: 0;
        }

        /* Use simple CSS columns for masonry layout */
        .masonry-grid {
            column-count: 3;
            column-gap: 5px;
        }

        .masonry-item {
            display: block;
            break-inside: avoid;
            margin-bottom: 5px;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            transform: translateZ(0);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            mask-image: radial-gradient(white, black);
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            transform: scale(1.03);
            transition: transform var(--trans-slow);
        }

        .masonry-item:hover img {
            transform: scale(1.08);
        }

        /* Lightbox specific CSS */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity var(--trans-fast);
        }

        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 90vh;
            border: 2px solid var(--color-white);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--color-white);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: color var(--trans-fast);
        }

        .lightbox-close:hover {
            color: var(--color-accent);
        }

        @media (max-width: 991px) {
            .masonry-grid {
                column-count: 2;
            }
        }
        @media (max-width: 576px) {
            .masonry-grid {
                column-count: 1;
            }
        }
    </style>
</head>
